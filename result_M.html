<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>남성 얼굴형 분석 결과</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <style>
        body {
            text-align: center;
            margin-top: 20px; 
            padding: 0 15px; 
            font-family: Arial, sans-serif;
            background-color: #FDFCF5;
            color: #333;
        }
        h1 {
            font-size: 24px; 
            color: #5D4037; 
            margin-bottom: 10px;
        }
        #result {
            font-size: 30px;
            font-weight: 700;
            color: #5D4037;
            margin-top: 15px;
        }
        #desc {
            font-size: 16px; 
            color: #4C3C3C;
            margin-top: 8px;
        }
        button {
            padding: 12px 20px; 
            font-size: 16px;
            background: #C4A983; 
            color: #FFFFFF;
            border: 1px solid #C4A983; 
            border-radius: 5px;
            cursor: pointer;
            margin-top: 30px; 
            transition: background-color 0.3s, box-shadow 0.3s;
            font-weight: 600;
        }
        button:hover {
            background-color: #91755C;
            border: 1px solid #91755C;
        }

        /* 상세 정보 컨테이너 스타일 */
        #detail-container {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #D1C5B0;
            border-radius: 10px;
            background-color: #EBE5D8;
            text-align: left;
        }
        .detail-title {
            font-weight: 700;
            color: #A0522D;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        .recommendation {
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .key-points {
            list-style-type: none;
            padding-left: 0;
        }
        .key-points li {
            margin-bottom: 5px;
            color: #4C3C3C;
        }
        
        /* 추천 이미지 갤러리 스타일 */
        #image-gallery {
            display: flex; 
            justify-content: space-around; 
            gap: 10px; 
            margin-top: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap; 
        }
        .recommend-image {
            width: calc(33.33% - 10px); 
            max-width: 120px; 
            height: auto;
            border-radius: 8px;
            object-fit: cover;
            border: 3px solid #D1C5B0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        /* 모바일 환경 최적화 (400px 이하 화면에서 1열로 표시) */
        @media (max-width: 400px) {
            .recommend-image {
                width: 100%; 
                max-width: none;
                margin-bottom: 10px;
            }
        }

    </style>
</head>
<body>

<h1>남성 얼굴형 분석 결과</h1>

<div id="result"></div>
<div id="desc"></div>

<div id="detail-container">
    
    <div class="detail-title">추천 헤어스타일</div>
    <div id="image-gallery">
        </div>
    
    <div class="detail-title">얼굴형 특징</div>
    <div id="feature-content" class="recommendation"></div>

    <div class="detail-title">헤어스타일 추천 전략</div>
    <ul id="strategy-content" class="key-points"></ul>
</div>


<div style="height:30px;"></div>

<button
    id="go-home-button"
    onclick="goToHome()">
    처음으로
</button>

<button 
    onclick="goToOtherStyles()">
    다른 얼굴형 헤어스타일 추천 보기
</button>

<script>
const resultData = {
    "둥근형": {
        // image: "assets/M/둥근형"
        recommendationImages: [ 
            "assets/M/둥근형/남자둥근형.jfif", 
            "assets/M/둥근형/남자둥근형2.jfif", 
            "assets/M/둥근형/남자둥근형3.jfif"
        ], 
        features: "둥근형은 가로와 세로 비율이 비슷하고 턱선이 부드러워, 전체적으로 선하고 어려 보이는 동안 이미지를 가진 얼굴형인데요. 대표적인 연예인으로 송중기, 정해인, 디오(도경수) 님이 있습니다. 이런 분들은 얼굴 골격이 부드럽기 때문에 자칫하면 이목구비가 흐릿해 보이거나 얼굴이 넙데데해 보일 수 있습니다. 그래서 세로 선을 강조하여 갸름해 보이게 하고, 직선적인 느낌을 더해 남성미를 살려주는 헤어스타일링을 추천해 드립니다!",
        strategies: [    
            "아이비리그컷 / 리젠트컷 (이마를 시원하게 드러내 세로 길이감 확보)",
            "포마드 스타일 (윗머리 볼륨을 살려 시선을 위로 분산)",
            "옆머리 다운펌 (옆 부피를 최대한 줄여 슬림한 라인 만들기)"
        ]
    },
    "긴형": {
        // image: "assets/M/긴형"
        recommendationImages: [ 
            "assets/M/긴형/남자긴형1.jpg", 
            "assets/M/긴형/남자긴형2.jpg", 
            "assets/M/긴형/남자긴형3.jpg"
        ], 
        features: "긴형은 가로 폭에 비해 세로 길이가 길어, 지적이고 성숙하며 시크한 이미지를 주는 얼굴형인데요. 대표적인 연예인으로 김우빈, 강동원, 이광수 님이 있습니다. 이런 분들은 이마를 완전히 드러내거나 옆머리를 너무 짧게 칠 경우 얼굴이 더 길어 보일 수 있습니다. 그래서 위쪽 볼륨은 적당히 조절하고 옆 볼륨을 채워 밸런스를 맞춰주는 헤어스타일링을 추천해 드립니다!",
        strategies: [
            "댄디컷 / 시스루 댄디컷 (앞머리로 이마를 덮어 얼굴 길이 축소)",
            "소프트 투블럭 (옆머리를 하얗게 밀지 않고 기장감을 남겨 채우기)",
            "가르마펌 (5:5) (가로 비율을 넓혀 보여 긴 얼굴 보완)"
        ]
    },
    "각진형": {
        // image: "assets/M/각진형"
        recommendationImages: [ 
            "assets/M/각진형/남자각진형1.jfif", 
            "assets/M/각진형/남자각진형2.jfif", 
            "assets/M/각진형/남자각진형3.jfif"
        ], 
        features: "각진형은 턱선과 광대가 발달하여 강인하고 남성적인 분위기를 물씬 풍기는 얼굴형인데요. 대표적인 연예인으로 이동욱, 박서준, 여진구 님이 있습니다. 이런 분들은 하관이 강해 자칫 인상이 너무 강하거나 딱딱해 보일 수 있습니다. 그래서 각진 턱과 광대를 부드럽게 커버할 수 있는 곡선감(Curve)과 질감 처리가 들어간 헤어스타일링을 해주시는 걸 추천해 드립니다!",
        strategies: [
            "섀도우펌 (S컬 웨이브로 강한 인상을 부드럽게 중화)",
            "리프컷 (긴 기장감으로 광대와 턱 라인을 자연스럽게 감싸기)",,
            "애즈펌 (이마를 살짝만 노출해 부드러운 분위기 연출)"
        ]
    },
    "계란형": {
        // image: "assets/M/계란형"
        recommendationImages: [ 
            "assets/M/계란형/남자계란형1.jfif", 
            "assets/M/계란형/남자계란형2.jfif", 
            "assets/M/계란형/남자계란형3.jfif"
        ], 
        features: "계란형은 얼굴의 가로, 세로 비율이 이상적이고 턱선이 갸름하여 대부분의 헤어스타일을 완벽하게 소화하는 축복받은 얼굴형인데요. 대표적인 연예인으로 차은우, 송강, 뷔님이 있습니다. 이런 분들은 특별히 피해야 할 스타일은 없으나, 장점인 얼굴형을 너무 가리지 않는 것이 좋습니다. 이마를 드러내어 이목구비를 강조하거나 트렌디한 스타일을 과감하게 시도해보시는 걸 추천해 드립니다!",
        strategies: [
            "가일컷 / 드롭컷 (트렌디하면서도 얼굴형의 장점을 살림)",
            "시스루 댄디컷 (꾸민 듯 안 꾸민 듯 자연스러운 매력)",
            "히피펌 / 베이비펌 (다양한 컬 스타일도 무리 없이 소화)"
        ]
    }
};

// URL에서 label 가져오기
const params = new URLSearchParams(window.location.search);
const label = params.get("label");

const data = resultData[label];

// 결과 출력 (데이터가 있을 때만)
if (data) {
    document.getElementById("result").innerHTML = label + " 얼굴형";

    // 추천 이미지 갤러리 출력 로직
    const gallery = document.getElementById("image-gallery");
    gallery.innerHTML = ''; 
    
    if (data.recommendationImages && data.recommendationImages.length > 0) {
        data.recommendationImages.forEach((imagePath, index) => {
            const img = document.createElement("img");
            img.src = imagePath;
            img.alt = `${label} 추천 헤어스타일 ${index + 1}`;
            img.classList.add("recommend-image");
            gallery.appendChild(img);
        });
    }

    // 특징 및 전략 출력
    document.getElementById("feature-content").innerHTML = data.features;
    
    const strategyList = document.getElementById("strategy-content");
    strategyList.innerHTML = ''; 
    data.strategies.forEach(strategy => {
        const li = document.createElement("li");
        li.innerHTML = `<span style="color: #A0522D; font-weight: 700;">●</span> ${strategy}`;
        strategyList.appendChild(li);
    });

} else {
    document.getElementById("result").innerHTML = "분석 오류";
    document.getElementById("desc").innerHTML = "얼굴형 정보를 불러올 수 없습니다. 다시 시도해 주세요.";
    document.getElementById("detail-container").style.display = "none";
}

function goToHome()
{
    window.location.href = "index.html";
}

// 버튼 클릭 시 다른 페이지 이동
function goToOtherStyles() {
    window.location.href = "other_M.html";
}
</script>

</body>
</html>
